<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo">
          
            <h2>ADMIN PORTAL</h2>
        </div>

        <ul class="menu">

            <li class="active">
                <a href="index.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="student.html">
                    <i class="fa-solid fa-user-graduate"></i>
                    Students
                </a>
            </li>

            <li>
                <a href="courses.html">
                    <i class="fa-solid fa-book"></i>
                    Courses
                </a>
            </li>

            <li>
                <a href="teachers.html">
                    <i class="fa-solid fa-users"></i>
                    Teachers
                </a>
            </li>

            <li>
                <a href="schedule.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    Schedule
                </a>
            </li>

            <li>
                <a href="reports.html">
                    <i class="fa-solid fa-square-poll-vertical"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </li>
            <div class="S">
                <a href="login.html">
                    Login 
                </a>
                <a href="logout.html">
                    Logout
                </a> 
            </div>
         

        </ul>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <!-- Topbar -->

        <div class="topbar">

           <div class="search-box">

    <input type="text"
        id="searchInput"
        placeholder="Search student">

    <button>
        Search
    </button>

    </div>
            

            <div class="admin">

                <img src="srikanth.png" alt="profile pic">

                <span>Admin</span>

            </div>

        </div>

        <!-- Cards -->

        <div class="cards">

            <div class="card">

                <div>
                    <h2 id="studentCount">125</h2>
                    <p>Total Students</p>
                </div>

                <i class="fa-solid fa-user-graduate"></i>

            </div>

            <div class="card">

                <div>
                    <h2 id="coursesCount">15</h2>
                    <p>Total Courses</p>
                </div>

                <i class="fa-solid fa-book-open"></i>

            </div>

            <div class="card">

                <div>
                    <h2 id="teachersCount">10</h2>
                    <p>Total Staff</p>
                </div>

                <i class="fa-solid fa-users"></i>

            </div>

            <div class="card">

                <div>
                    <h2>95%</h2>
                    <p>Attendance</p>
                </div>

                <i class="fa-solid fa-chart-pie"></i>

            </div>

        </div>

        <!-- Student Form -->
    <div>

        <div class="student-form">

            <h2>Add / Edit Student</h2>

            <div class="form-grid">

                <input type="hidden" id="editIndex">

                <input type="text"
                    id="name"
                    placeholder="Student Name">

                <input type="email"
                    id="email"
                    placeholder="Email Address">

                <input type="text"
                    id="course"
                    placeholder="Course">

                <select id="status">

                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                </select>

                
            </div>
            <button id="addBtn"onclick="addStudent()">Add Student</button>

        </div>

        

    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
